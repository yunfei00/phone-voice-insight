[project]
name = "phone-voice-insight-backend"
version = "0.1.0"
description = "Phone Voice Insight Django backend"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "celery==5.6.3",
  "django==5.2.16",
  "django-celery-beat==2.8.1",
  "django-cors-headers==4.9.0",
  "django-filter==25.2",
  "djangorestframework==3.16.1",
  "drf-spectacular==0.29.0",
  "gunicorn==23.0.0; sys_platform != 'win32'",
  "psycopg[binary]==3.3.2",
  "pydantic==2.12.5",
  "python-dotenv==1.2.2",
  "redis==7.2.1",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]==5.2.9",
  "djangorestframework-stubs[compatible-mypy]==3.16.8",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "pytest-django==4.12.0",
  "ruff==0.15.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "RUF", "ARG"]
ignore = [
  "DJ001", # external_id 需要 NULL 以获得跨数据库一致的条件唯一约束
  "DJ008",
  "RUF002", # 中文文档字符串中的全角标点是有意的
  "RUF012", # Django Meta 的 constraints/indexes 按框架约定使用列表
]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = ".."
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["config.settings.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "django_filters", "django_filters.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
