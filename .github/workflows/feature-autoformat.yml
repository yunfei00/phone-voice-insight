name: Feature autoformat
on:
  pull_request:
  push:
    branches: [feature/communication-dashboard]
    paths:
      - 'frontend/src/api/index.ts'
      - 'frontend/src/views/CommunicationDashboardView.vue'
      - 'frontend/src/views/StructuredAnalysisView.vue'
      - 'backend/apps/analysis/structured_views.py'
      - '.github/workflows/feature-autoformat.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-dashboard
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write src/api/index.ts src/views/CommunicationDashboardView.vue src/views/StructuredAnalysisView.vue
        working-directory: frontend
      - run: uv run ruff format apps/analysis/structured_views.py
        working-directory: backend
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api/index.ts frontend/src/views/CommunicationDashboardView.vue frontend/src/views/StructuredAnalysisView.vue backend/apps/analysis/structured_views.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply prettier and ruff formatting"
            git push origin HEAD:feature/communication-dashboard
          fi
