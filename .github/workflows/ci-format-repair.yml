name: Temporary Prettier Repair
on:
  push:
    branches: [fix/dashboard-risk-trend]
    paths: [.github/workflows/ci-format-repair.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-risk-trend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write src/views/DataQualityView.vue
        working-directory: frontend
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/views/DataQualityView.vue
          git diff --cached --quiet || git commit -m "style: apply Prettier to data quality view"
          git push
