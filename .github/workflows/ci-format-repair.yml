name: Temporary CI format repair
on:
  push:
    branches: [fix/dashboard-risk-trend]
    paths: [.github/workflows/ci-format-repair.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-risk-trend
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff format apps/collection/services/collection_runner.py apps/collection/services/honor_full.py
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write src/views/CollectionTasksView.vue src/views/DashboardView.vue
        working-directory: frontend
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/apps/collection/services/collection_runner.py backend/apps/collection/services/honor_full.py frontend/src/views/CollectionTasksView.vue frontend/src/views/DashboardView.vue
          if ! git diff --cached --quiet; then
            git commit -m "style: format collection fixes for CI"
            git push origin HEAD:fix/dashboard-risk-trend
          fi
