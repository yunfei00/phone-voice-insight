name: Temporary PR7 formatter
on:
  push:
    paths:
      - .github/workflows/pr7-format-once.yml
jobs:
  format:
    if: github.ref == 'refs/heads/fix/full-collection-retry-status-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format Python
        run: |
          cd backend
          uv run ruff format apps/collection/services/honor_full.py ../collectors/honor_club/client.py
      - name: Format Vue
        run: |
          cd frontend
          npm ci
          npx prettier --write src/views/CollectionTasksView.vue
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/apps/collection/services/honor_full.py collectors/honor_club/client.py frontend/src/views/CollectionTasksView.vue
          if ! git diff --cached --quiet; then
            git commit -m "style: apply automated Ruff and Prettier formatting"
            git push
          fi
