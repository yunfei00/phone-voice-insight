name: One-time format repair

on:
  push:
    branches: [feat/voice-structured-insights]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'yunfei00/phone-voice-insight' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voice-structured-insights
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format Python
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff format apps/collection/services/collection_runner.py apps/collection/services/honor_full.py
      - name: Format Vue
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/views/AITasksView.vue src/views/CollectionTasksView.vue src/views/IssuesView.vue src/views/StructuredAnalysisView.vue
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/apps/collection/services/collection_runner.py backend/apps/collection/services/honor_full.py frontend/src/views/AITasksView.vue frontend/src/views/CollectionTasksView.vue frontend/src/views/IssuesView.vue frontend/src/views/StructuredAnalysisView.vue
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Ruff and Prettier formatting for CI'
            git push origin HEAD:feat/voice-structured-insights
          fi
