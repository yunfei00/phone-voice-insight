name: Format repair
on:
  push:
    branches:
      - feat/voice-structured-insights
    paths:
      - .github/workflows/format-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Format Python
        working-directory: backend
        run: |
          uv run --with ruff==0.15.7 ruff format . ../collectors ../ai ../tools
          uv run --with ruff==0.15.7 ruff check --fix . ../collectors ../ai ../tools
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/api/index.ts src/views/AISettingsView.vue src/views/DataQualityView.vue src/views/StructuredAnalysisView.vue
      - name: Commit format fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/apps/accounts/serializers.py backend/apps/accounts/views.py backend/apps/analysis/services/structured_engine.py backend/apps/analysis/tasks.py backend/apps/reports/services.py backend/apps/reviews/services/final_corpus.py frontend/src/api/index.ts frontend/src/views/AISettingsView.vue frontend/src/views/DataQualityView.vue frontend/src/views/StructuredAnalysisView.vue
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff and Prettier formatting"
            git push origin HEAD:feat/voice-structured-insights
          fi
