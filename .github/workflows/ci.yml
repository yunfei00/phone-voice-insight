name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  repair-format:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/dashboard-risk-trend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-risk-trend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write src/views/DataQualityView.vue
        working-directory: frontend
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/views/DataQualityView.vue
          git diff --cached --quiet || git commit -m 'style: autoformat data quality view'
          git push origin HEAD:fix/dashboard-risk-trend
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff format --check . ../collectors ../ai ../tools
          uv run ruff check . ../collectors ../ai ../tools
      - name: Type check
        run: uv run mypy . ../collectors ../ai ../tools
      - name: Migrations are current
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Structured analysis contract
        run: uv run python manage.py check_structured_analysis_contract
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
