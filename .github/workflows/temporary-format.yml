name: Temporary format
on:
  push:
    paths:
      - .github/workflows/temporary-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format backend
        working-directory: backend
        run: uv run --with ruff==0.15.7 ruff format apps/analysis/structured_views.py apps/analysis/tasks.py
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/views/StructuredAnalysisView.vue src/api/index.ts src/layouts/MainLayout.vue
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/apps/analysis/structured_views.py backend/apps/analysis/tasks.py frontend/src/views/StructuredAnalysisView.vue frontend/src/api/index.ts frontend/src/layouts/MainLayout.vue
          if ! git diff --cached --quiet; then
            git commit -m "style: format analysis progress implementation"
            git push origin HEAD:feat/voice-structured-insights
          fi
