name: Format system-fixes branch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/system-fixes
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.2'
      - run: uv python install 3.12
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check --fix . ../collectors ../ai ../tools
        working-directory: backend
      - run: uv run ruff format . ../collectors ../ai ../tools
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npx prettier --write .
        working-directory: frontend
      - run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend collectors ai tools frontend
            git commit -m "style: persist Ruff and Prettier corrections"
            git push origin HEAD:work/system-fixes
          fi
