name: Format communication branch
on:
  push:
    branches: [feature/communication-dashboard]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-dashboard
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
      - name: Format Python
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff format . ../collectors ../ai ../tools
          uv run ruff check --fix . ../collectors ../ai ../tools
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/views/CommunicationDashboardView.vue src/api/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend ai collectors tools frontend
          if ! git diff --cached --quiet; then
            git commit -m "style: format communication dashboard branch"
            git push origin HEAD:feature/communication-dashboard
          fi
