name: Temporary full governance formatter
on:
  push:
    paths:
      - .github/workflows/full-governance-format-once.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          cd backend
          uv run ruff format apps/reviews/views.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/apps/reviews/views.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format full governance endpoint"
            git push
          fi
