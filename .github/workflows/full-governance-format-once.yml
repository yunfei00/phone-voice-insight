name: Temporary frontend formatter
on:
  push:
    paths:
      - .github/workflows/full-governance-format-once.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npx prettier --write src/views/DataQualityView.vue
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/views/DataQualityView.vue
          if ! git diff --cached --quiet; then
            git commit -m "style: format full governance UI"
            git push
          fi
