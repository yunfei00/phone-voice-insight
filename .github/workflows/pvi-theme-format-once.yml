name: Temporary theme formatter
on:
  push:
    paths:
      - .github/workflows/pvi-theme-format-once.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          cd frontend
          npm ci
          npx prettier --write src/assets/main.css src/views/ThreadsView.vue src/views/DataQualityView.vue src/views/DashboardView.vue
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to PVI theme"
            git push
          fi
