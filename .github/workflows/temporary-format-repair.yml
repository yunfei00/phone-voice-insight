name: Temporary code-format repair
on:
  push:
    branches: [feature/communication-dashboard]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repository formatters
        run: |
          uvx ruff format backend/apps/analysis/services/structured_engine.py backend/apps/analysis/tasks.py
          cd frontend
          npm ci
          npx prettier --write src/views/AISettingsView.vue src/views/AITasksView.vue src/views/StructuredAnalysisView.vue
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/apps/analysis/services/structured_engine.py backend/apps/analysis/tasks.py frontend/src/views/AISettingsView.vue frontend/src/views/AITasksView.vue frontend/src/views/StructuredAnalysisView.vue
            git commit -m "style: apply Ruff and Prettier to pending CI files"
            git push
          fi
