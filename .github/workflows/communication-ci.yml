name: Communication dashboard CI
on:
  push:
    branches: [feature/communication-dashboard]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
      - name: Format backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff format . ../collectors ../ai ../tools
          uv run ruff check --fix . ../collectors ../ai ../tools
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format frontend
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/views/CommunicationDashboardView.vue src/api/index.ts
      - name: Push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend ai collectors tools frontend
          if ! git diff --cached --quiet; then
            git commit -m "style: autoformat communication branch"
            git push origin HEAD:${{ github.head_ref }}
          fi
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Check Python syntax
        working-directory: backend
        run: uv run python -m compileall -q apps ../ai
      - name: Ruff
        working-directory: backend
        run: uv run ruff check apps/analysis/management/commands/reclassify_history.py apps/assistant/orchestrator.py apps/analysis/structured_views.py apps/analysis/services/structured_engine.py apps/analysis/tasks.py
      - name: Django checks
        working-directory: backend
        run: uv run python manage.py check --settings=config.settings.test
      - name: Regression tests
        working-directory: backend
        run: uv run pytest -q tests/test_assistant_relative_dates.py tests/test_communication_aggregation.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
