name: Communication dashboard CI
on:
  push:
    branches: [feature/communication-dashboard]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Check Python syntax
        working-directory: backend
        run: uv run python -m compileall -q apps ../ai
      - name: Ruff
        working-directory: backend
        run: uv run ruff check apps/analysis/management/commands/reclassify_history.py apps/assistant/orchestrator.py apps/analysis/structured_views.py apps/analysis/services/structured_engine.py apps/analysis/tasks.py
      - name: Django checks
        working-directory: backend
        run: uv run python manage.py check --settings=config.settings.test
      - name: Regression tests
        working-directory: backend
        run: uv run pytest -q tests/test_assistant_relative_dates.py tests/test_communication_aggregation.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend



  format-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-dashboard
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Prettier
        run: |
          cd frontend
          npm ci
          npx prettier --write src/views/ComparisonView.vue
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/views/ComparisonView.vue
            git commit -m "style: apply Prettier to comparison view"
            for attempt in 1 2 3 4 5; do
              git fetch origin feature/communication-dashboard
              git rebase origin/feature/communication-dashboard
              if git push origin HEAD:feature/communication-dashboard; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
