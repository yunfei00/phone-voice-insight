name: Communication dashboard CI
on:
  push:
    branches: [feature/communication-dashboard]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Check Python syntax
        working-directory: backend
        run: uv run python -m compileall -q apps ../ai
      - name: Ruff
        working-directory: backend
        run: uv run ruff check apps/analysis/management/commands/reclassify_history.py apps/assistant/orchestrator.py apps/analysis/structured_views.py apps/analysis/services/structured_engine.py apps/analysis/tasks.py
      - name: Django checks
        working-directory: backend
        run: uv run python manage.py check --settings=config.settings.test
      - name: Regression tests
        working-directory: backend
        run: uv run pytest -q tests/test_assistant_relative_dates.py tests/test_communication_aggregation.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  format-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-dashboard
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format pending CI files
        run: |
          cd backend
          uv sync --frozen
          uv run ruff format apps/analysis/services/structured_engine.py apps/analysis/tasks.py
          cd ../frontend
          npm ci
          npx prettier --write src/views/AISettingsView.vue src/views/AITasksView.vue src/views/DashboardView.vue src/views/StructuredAnalysisView.vue
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/apps/analysis/services/structured_engine.py backend/apps/analysis/tasks.py frontend/src/views/AISettingsView.vue frontend/src/views/AITasksView.vue frontend/src/views/DashboardView.vue frontend/src/views/StructuredAnalysisView.vue
            git commit -m "style: format Ruff and Prettier CI failures"
            git push origin HEAD:feature/communication-dashboard
          fi
